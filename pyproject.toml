[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ustc-nihongo-quiz"
version = "0.1.0"
description = "Quiz system for the USTC Japanese Association garden party"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cryptography>=50,<51",
    "Django>=5.2,<5.3",
    "django-axes[ipware]>=8,<9",
    "gunicorn>=23,<24",
    "openpyxl>=3.1,<4",
    "phonenumbers>=9,<10",
    "Pillow>=12,<13",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.8,<5",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "postgres: requires the PostgreSQL integration database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
