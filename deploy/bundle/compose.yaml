name: ${COMPOSE_PROJECT_NAME:-quiz-platform}
services:
  db:
    image: ${POSTGRES_IMAGE:?Run quizctl.py init first}
    environment:
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Required}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes:
      - database:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-quiz.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d quiz_platform']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging: {driver: json-file, options: {max-size: 5m, max-file: '3'}}
  backend:
    image: ${APP_IMAGE:?Run quizctl.py init first}
    pull_policy: never
    env_file: .env
    environment: &application_database
      POSTGRES_HOST: db
      POSTGRES_DB: quiz_platform
      POSTGRES_USER: quiz_platform
      DJANGO_USE_SQLITE: '0'
      QUIZ_TRUSTED_PROXY_HOSTS: gateway
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - media:/app/media
      - static:/app/staticfiles
      - ./content:/app/_private/content:ro
    read_only: true
    tmpfs: [/tmp:size=64m, /app/var:size=16m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    logging: {driver: json-file, options: {max-size: 5m, max-file: '3'}}
  maintenance:
    image: ${APP_IMAGE:?Run quizctl.py init first}
    pull_policy: never
    env_file: .env
    environment: *application_database
    depends_on:
      db: {condition: service_healthy}
    command: [sh, -c, 'while true; do python manage.py expire_stale_attempts && python manage.py prune_rate_limit_buckets; sleep 60; done']
    healthcheck: {disable: true}
    init: true
    read_only: true
    tmpfs: [/tmp:size=32m, /app/var:size=16m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.1
    logging: {driver: json-file, options: {max-size: 5m, max-file: '3'}}
  gateway:
    image: ${GATEWAY_IMAGE:?Run quizctl.py init first}
    environment:
      PUBLIC_SITE: ${PUBLIC_SITE}
      ADMIN_SITE: ${ADMIN_SITE}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN}
    ports:
      - '${BIND_ADDRESS}:${HTTP_PORT}:80'
      - '${BIND_ADDRESS}:${HTTPS_PORT}:443'
      - '127.0.0.1:${ADMIN_PORT}:${ADMIN_INTERNAL_PORT}'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - certificates:/data
      - gateway_config:/config
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    logging: {driver: json-file, options: {max-size: 5m, max-file: '3'}}
volumes:
  database:
  media:
  static:
  certificates:
  gateway_config:
